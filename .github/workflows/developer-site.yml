name: Publish developer website

on:
  # Enable Settings > Pages > Source: GitHub Actions before the first run.
  push:
    branches: [main]
    paths:
      - 'docs/site/dist/**'
      - '.github/workflows/developer-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: developer-website-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
